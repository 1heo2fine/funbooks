<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fykk gamehub - Unblocked Redirects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #000000;
      --bg-elevated: #0a0a0a;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-strong: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-hover: rgba(255, 255, 255, 0.18);
      --text: #fafafa;
      --text-muted: #71717a;
      --text-dim: #3f3f46;
      --accent: #22c55e;
      --accent-glow: rgba(34, 197, 94, 0.4);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.4);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --transition-fast: 0.15s ease-out;
    }

    @media (prefers-reduced-motion: reduce) {
      :root { --transition: 0.01ms; --transition-fast: 0.01ms; }
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 197, 94, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(239, 68, 68, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse 100% 60% at 10% 30%, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
      pointer-events: none;
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: -1;
      opacity: 0.4;
    }

    /* Header */
    .page-header {
      text-align: center;
      margin-bottom: 36px;
      max-width: 720px;
      animation: fadeSlideUp 0.8s var(--transition);
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-title {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, #a3a3a3 50%, #52525b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }

    .page-subtitle {
      color: var(--text-muted);
      font-weight: 400;
      font-size: clamp(0.875rem, 2vw, 1rem);
      margin-top: 10px;
      letter-spacing: 0.01em;
    }

    /* Search Bar - Liquid Glass */
    .search-bar {
      width: 100%;
      max-width: 720px;
      margin-bottom: 28px;
      animation: fadeSlideUp 0.8s var(--transition) 0.1s both;
    }

    .search-wrapper {
      position: relative;
    }

    .search-wrapper::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: calc(var(--radius) + 2px);
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), transparent 50%, rgba(239, 68, 68, 0.1));
      opacity: 0;
      transition: opacity var(--transition);
      z-index: -1;
      filter: blur(20px);
    }

    .search-wrapper:focus-within::before {
      opacity: 1;
    }

    .search-input {
      width: 100%;
      padding: 16px 20px 16px 52px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      font-family: inherit;
      outline: none;
      transition: all var(--transition);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .search-input::placeholder {
      color: var(--text-dim);
      font-weight: 400;
    }

    .search-input:hover {
      background: var(--glass-strong);
      border-color: var(--glass-border-hover);
    }

    .search-input:focus {
      background: var(--glass-strong);
      border-color: rgba(34, 197, 94, 0.35);
      box-shadow: 
        0 0 0 3px rgba(34, 197, 94, 0.1),
        0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 1.15rem;
      pointer-events: none;
      transition: color var(--transition-fast);
    }

    .search-wrapper:focus-within .search-icon {
      color: var(--accent);
    }

    /* Filter Bar - Glass Pills */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 4px;
      animation: fadeSlideUp 0.8s var(--transition) 0.15s both;
    }

    .filter-chip {
      position: relative;
      padding: 10px 20px;
      border-radius: 100px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all var(--transition);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
    }

    .filter-chip::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent), #16a34a);
      opacity: 0;
      transition: opacity var(--transition);
    }

    .filter-chip:hover {
      background: var(--glass-strong);
      border-color: var(--glass-border-hover);
      color: var(--text);
      transform: translateY(-1px);
    }

    .filter-chip.active {
      background: transparent;
      border-color: transparent;
      color: #050505;
      box-shadow: 
        0 4px 20px var(--accent-glow),
        0 0 0 1px rgba(34, 197, 94, 0.3) inset;
    }

    .filter-chip.active::before {
      opacity: 1;
    }

    .filter-chip.active span {
      position: relative;
      z-index: 1;
    }

    /* Links List */
    .links-list {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeSlideUp 0.8s var(--transition) 0.2s both;
    }

    /* Link Card - Liquid Glass */
    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 14px 18px;
      transition: all var(--transition);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
      overflow: hidden;
    }

    .link-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, transparent 50%);
      pointer-events: none;
    }

    .link-card::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), #16a34a);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform var(--transition);
    }

    .link-card:hover {
      background: var(--glass-strong);
      border-color: var(--glass-border-hover);
      transform: translateX(4px);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(34, 197, 94, 0.1) inset;
    }

    .link-card:hover::after {
      transform: scaleY(1);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .link-favicon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all var(--transition-fast);
    }

    .link-card:hover .link-favicon {
      border-color: var(--glass-border-hover);
      transform: scale(1.05);
    }

    .link-info {
      flex: 1;
      min-width: 0;
    }

    .link-url {
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      word-break: break-all;
      display: block;
      letter-spacing: -0.01em;
      transition: color var(--transition-fast);
    }

    .link-card:hover .link-url {
      color: var(--accent);
    }

    /* Custom Vote Buttons - Tiny Glass Pills */
    .link-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .vote-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      transition: all var(--transition-fast);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .vote-btn:active {
      transform: scale(0.95);
    }

    .vote-btn svg {
      width: 12px;
      height: 12px;
      stroke-width: 2.5;
      transition: all var(--transition-fast);
    }

    .vote-btn .vote-count {
      min-width: 24px;
      text-align: center;
      font-size: 0.65rem;
      font-variant-numeric: tabular-nums;
      transition: all var(--transition-fast);
    }

    /* Up Vote - Green */
    .vote-btn.up:hover,
    .vote-btn.up.active {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.35);
      color: var(--accent);
      box-shadow: 
        0 0 0 3px rgba(34, 197, 94, 0.1),
        0 4px 16px var(--accent-glow);
    }

    .vote-btn.up.active {
      background: rgba(34, 197, 94, 0.25);
      border-color: var(--accent);
    }

    .vote-btn.up.active svg {
      fill: var(--accent);
      stroke: var(--accent);
    }

    .vote-btn.up.active .vote-count {
      color: var(--accent);
    }

    /* Down Vote - Red */
    .vote-btn.down:hover,
    .vote-btn.down.active {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.35);
      color: var(--danger);
      box-shadow: 
        0 0 0 3px rgba(239, 68, 68, 0.1),
        0 4px 16px var(--danger-glow);
    }

    .vote-btn.down.active {
      background: rgba(239, 68, 68, 0.25);
      border-color: var(--danger);
    }

    .vote-btn.down.active svg {
      fill: var(--danger);
      stroke: var(--danger);
    }

    .vote-btn.down.active .vote-count {
      color: var(--danger);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 60px 20px;
      font-weight: 500;
      font-size: 0.95rem;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 600px) {
      body { padding: 24px 16px 40px; }
      .page-title { font-size: 2rem; }
      .link-card { padding: 12px 14px; }
      .link-url { font-size: 0.875rem; }
      .link-favicon { width: 32px; height: 32px; }
      .vote-btn { padding: 5px 8px; font-size: 0.65rem; }
      .vote-btn svg { width: 11px; height: 11px; }
      .filter-chip { padding: 8px 16px; font-size: 0.7rem; }
      .search-input { padding: 14px 16px 14px 48px; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1 class="page-title">fykk gamehub</h1>
    <p class="page-subtitle">Click a link to open it. Vote on whether it works at your school.</p>
  </div>

  <div class="search-bar">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input id="search-input" class="search-input" type="text" placeholder="Search links..." autocomplete="off" />
    </div>
  </div>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-chip active" data-filter="all"><span>All</span></button>
    <button class="filter-chip" data-filter="hot"><span>Hot</span></button>
    <button class="filter-chip" data-filter="new"><span>New</span></button>
    <button class="filter-chip" data-filter="recommended"><span>Recommended</span></button>
    <button class="filter-chip" data-filter="low"><span>Low rated</span></button>
  </div>

  <div class="links-list" id="links-list"></div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
