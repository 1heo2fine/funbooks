<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>funbooks.lol - Unblocked Redirects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0f0f13;
      --bg-elevated: #14141a;
      --glass: rgba(255, 255, 255, 0.02);
      --glass-strong: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-border-hover: rgba(255, 255, 255, 0.14);
      --text: #e8e8ec;
      --text-muted: #6b6b80;
      --text-dim: #4a4a5a;
      --accent: #00d4aa;
      --accent-glow: rgba(0, 212, 170, 0.3);
      --danger: #ff4757;
      --danger-glow: rgba(255, 71, 87, 0.35);
      --radius: 18px;
      --radius-sm: 12px;
      --transition: 0.35s cubic-bezier(0.25, 0.45, 0.45, 0.94);
      --transition-fast: 0.15s ease-out;
    }

    @media (prefers-reduced-motion: reduce) {
      :root { --transition: 0.01ms; --transition-fast: 0.01ms; }
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 50px;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle animated background gradient */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 100% 60% at 50% -10%, rgba(0, 212, 170, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse 80% 50% at 20% 80%, rgba(255, 71, 87, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(rgba(255,255,255,0.01) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: -1;
      opacity: 0.3;
    }

    /* Header */
    .page-header {
      text-align: center;
      margin-bottom: 32px;
      max-width: 640px;
      animation: fadeSlideUp 0.9s var(--transition);
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-title {
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 0%, #f0f0f5 50%, #4a4a6a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .page-subtitle {
      color: var(--text-muted);
      font-weight: 400;
      font-size: clamp(0.85rem, 1.5vw, 1rem);
      letter-spacing: 0.02em;
    }

    /* Search Bar - Liquid Glass */
    .search-bar {
      width: 100%;
      max-width: 640px;
      margin-bottom: 28px;
      animation: fadeSlideUp 0.9s var(--transition) 0.1s both;
    }

    .search-wrapper {
      position: relative;
    }

    .search-wrapper::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: calc(var(--radius) + 2px);
      background: linear-gradient(135deg, rgba(0, 212, 170, 0.12), transparent 50%, rgba(255, 71, 87, 0.08));
      opacity: 0;
      transition: opacity var(--transition);
      z-index: -1;
      filter: blur(24px);
    }

    .search-wrapper:focus-within::before {
      opacity: 1;
    }

    .search-input {
      width: 100%;
      padding: 18px 22px 18px 40px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      font-family: inherit;
      outline: none;
      transition: all var(--transition);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .search-input::placeholder {
      color: var(--text-dim);
      font-weight: 400;
    }

    .search-input:hover {
      background: var(--glass-strong);
      border-color: var(--glass-border-hover);
    }

    .search-input:focus {
      background: var(--glass-strong);
      border-color: rgba(0, 212, 170, 0.32);
      box-shadow: 
        0 0 0 4px rgba(0, 212, 170, 0.08),
        0 12px 40px rgba(0, 0, 0, 0.45);
    }

    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 1.1rem;
      pointer-events: none;
      transition: color var(--transition-fast);
    }

    .search-wrapper:focus-within .search-icon {
      color: var(--accent);
    }

    /* Filter Bar - Glass Pills (NO 50/50) */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 3px;
      animation: fadeSlideUp 0.9s var(--transition) 0.15s both;
    }

    .filter-chip {
      position: relative;
      padding: 10px 18px;
      border-radius: 100px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all var(--transition);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
    }

    .filter-chip::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent), #00a080);
      opacity: 0;
      transition: opacity var(--transition);
    }

    .filter-chip:hover {
      background: var(--glass-strong);
      border-color: var(--glass-border-hover);
      color: var(--text);
      transform: translateY(-1px) scale(1.02);
    }

    .filter-chip.active {
      background: transparent;
      border-color: transparent;
      color: #0a0a0f;
      box-shadow: 
        0 6px 24px var(--accent-glow),
        0 0 0 1px rgba(0, 212, 170, 0.25) inset;
    }

    .filter-chip.active::before {
      opacity: 1;
    }

    .filter-chip.active span {
      position: relative;
      z-index: 1;
    }

    .filter-chip span {
      position: relative;
      z-index: 1;
    }

    /* Links List */
    .links-list {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeSlideUp 0.9s var(--transition) 0.2s both;
    }

    /* Link Card - Liquid Glass (NO LETTER ICONS) */
    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 16px 18px;
      transition: all var(--transition);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      cursor: pointer;
      overflow: hidden;
    }

    .link-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.015) 0%, transparent 50%);
      pointer-events: none;
    }

    .link-card::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), #00a080);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform var(--transition);
    }

    .link-card:hover {
      background: var(--glass-strong);
      border-color: var(--glass-border-hover);
      transform: translateX(6px) scale(1.005);
      box-shadow: 
        0 12px 48px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(0, 212, 170, 0.12) inset;
    }

    .link-card:hover::after {
      transform: scaleY(1);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .link-info {
      flex: 1;
      min-width: 0;
    }

    .link-url {
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      word-break: break-all;
      display: block;
      letter-spacing: -0.01em;
      transition: color var(--transition-fast);
    }

    .link-card:hover .link-url {
      color: var(--accent);
    }

    /* Custom Tiny Glass Vote Buttons - FIXED SPACING */
    .link-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .vote-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      padding: 8px 12px; /* INCREASED PADDING TO FIX CUT OFF */
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.6rem; /* SLIGHTLY LARGER FONT */
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      transition: all var(--transition-fast);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .vote-btn:active {
      transform: scale(0.93);
    }

    .vote-btn svg {
      width: 12px; /* SLIGHTLY LARGER ICONS */
      height: 12px;
      stroke-width: 2;
      transition: all var(--transition-fast);
    }

    .vote-btn .vote-count {
      min-width: 24px; /* MORE SPACE FOR PERCENTAGES */
      text-align: center;
      font-size: 0.55rem;
      font-variant-numeric: tabular-nums;
      transition: all var(--transition-fast);
    }

    /* Up Vote - Green */
    .vote-btn.up:hover,
    .vote-btn.up.active {
      background: rgba(0, 212, 170, 0.12);
      border-color: rgba(0, 212, 170, 0.28);
      color: var(--accent);
      box-shadow: 
        0 0 0 3px rgba(0, 212, 170, 0.08),
        0 4px 14px var(--accent-glow);
    }

    .vote-btn.up.active {
      background: rgba(0, 212, 170, 0.18);
      border-color: var(--accent);
    }

    .vote-btn.up.active svg {
      fill: var(--accent);
      stroke: var(--accent);
    }

    .vote-btn.up.active .vote-count {
      color: var(--accent);
    }

    /* Down Vote - Red */
    .vote-btn.down:hover,
    .vote-btn.down.active {
      background: rgba(255, 71, 87, 0.12);
      border-color: rgba(255, 71, 87, 0.28);
      color: var(--danger);
      box-shadow: 
        0 0 0 3px rgba(255, 71, 87, 0.08),
        0 4px 14px var(--danger-glow);
    }

    .vote-btn.down.active {
      background: rgba(255, 71, 87, 0.18);
      border-color: var(--danger);
    }

    .vote-btn.down.active svg {
      fill: var(--danger);
      stroke: var(--danger);
    }

    .vote-btn.down.active .vote-count {
      color: var(--danger);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 48px 24px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 600px) {
      body { padding: 20px 14px 36px; }
      .page-title { font-size: 1.8rem; }
      .link-card { padding: 12px 14px; }
      .link-url { font-size: 0.75rem; }
      .vote-btn { padding: 6px 10px; font-size: 0.5rem; }
      .vote-btn svg { width: 10px; height: 10px; }
      .filter-chip { padding: 8px 14px; font-size: 0.55rem; }
      .search-input { padding: 12px 12px 12px 36px; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1 class="page-title">funbooks.lol</h1>
    <p class="page-subtitle">Click a link to open it. Vote on whether it works at your school.</p>
  </div>

  <div class="search-bar">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input id="search-input" class="search-input" type="text" placeholder="Search links..." autocomplete="off" />
    </div>
  </div>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-chip active" data-filter="all"><span>All</span></button>
    <button class="filter-chip" data-filter="hot"><span>Hot</span></button>
    <button class="filter-chip" data-filter="new"><span>New</span></button>
    <button class="filter-chip" data-filter="recommended"><span>Recommended</span></button>
    <button class="filter-chip" data-filter="low"><span>Low rated</span></button>
  </div>

  <div class="links-list" id="links-list"></div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
