<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fykk gamehub - Unblocked Redirects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #0a0a0a 100%);
      color: #f8fafc;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 80px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 600px;
    }

    .page-title {
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 0%, #a3a3a3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .page-subtitle {
      color: #94a3b8;
      font-weight: 600;
      font-size: 1rem;
      margin-top: 8px;
    }

    .search-bar {
      width: 100%;
      max-width: 700px;
      margin-bottom: 20px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #f8fafc;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .search-bar input::placeholder {
      color: #64748b;
    }

    .search-bar input:focus {
      background: rgba(255, 255, 255, 0.09);
      border-color: #737373;
    }

    .search-bar .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 1.1rem;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-chip {
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .filter-chip:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .filter-chip.active {
      background: #404040;
      border-color: #737373;
      color: #fff;
    }

    .links-list {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 18px;
      transition: all 0.2s ease;
      gap: 16px;
      cursor: pointer;
    }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .link-info {
      flex: 1;
      min-width: 0;
    }

    .link-url {
      color: #f1f5f9;
      font-weight: 700;
      font-size: 1rem;
      word-break: break-all;
      display: block;
    }

    .link-status-text {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 2px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .link-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .vote-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 800;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .vote-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .vote-btn.up:hover, .vote-btn.up.active {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border-color: rgba(34, 197, 94, 0.4);
    }

    .vote-btn.down:hover, .vote-btn.down.active {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .vote-count {
      min-width: 16px;
      text-align: center;
      font-size: 0.8rem;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      padding: 40px 20px;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .page-title { font-size: 1.8rem; }
      .link-card { padding: 12px 14px; }
      .link-url { font-size: 0.9rem; }
      .link-right { gap: 4px; }
      .vote-btn { padding: 5px 8px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1 class="page-title">fykk gamehub</h1>
    <p class="page-subtitle">Click a link to open it. Vote on whether it works at your school.</p>
  </div>

  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input id="search-input" type="text" placeholder="Search links..." />
  </div>

  <div class="filter-bar">
    <button class="filter-chip active" data-filter="all">All</button>
    <button class="filter-chip" data-filter="hot">Hot</button>
    <button class="filter-chip" data-filter="new">New</button>
    <button class="filter-chip" data-filter="recommended">Recommended</button>
    <button class="filter-chip" data-filter="50/50">50/50</button>
    <button class="filter-chip" data-filter="low">Low rated</button>
  </div>

  <div class="links-list" id="links-list"></div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
