        --ring: 224.3 76.3% 48%;
      }
      .bg-base-100 { background-color: hsl(var(--card)); }
      .bg-base-200 { background-color: hsl(var(--background)); }
      .text-base-content { color: hsl(var(--card-foreground)); }
      .text-base-content\/70 { color: hsl(var(--card-foreground) / 0.7); }
      .text-base-content\/50 { color: hsl(var(--card-foreground) / 0.5); }
