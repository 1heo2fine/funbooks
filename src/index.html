<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏈 Retro Bowl - Unblocked</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 10%, #1e293b 0%, #0f172a 100%);
    }

    /* Top Navigation Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      height: 56px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 20;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-badge {
      font-size: 1.5rem;
      line-height: 1;
    }

    .title-text {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .source-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .source-selector label {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .source-selector select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.8rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .source-selector select:hover {
      border-color: #38bdf8;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease-in-out;
      border: 1px solid transparent;
      outline: none;
      white-space: nowrap;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: #e2e8f0;
      border-color: rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .btn-primary:hover {
      background: #0369a1;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
    }

    /* Game Viewport */
    main {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 56px);
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    /* Banner notification for mirror fallback */
    #fallback-alert {
      display: none;
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.9);
      color: #fff;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      z-index: 10;
      pointer-events: none;
      animation: fadeInOut 4s ease forwards;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, -10px); }
      10% { opacity: 1; transform: translate(-50%, 0); }
      80% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -10px); display: none; }
    }

    /* Fallback / Loading Banner */
    .loading-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
      text-align: center;
    }

    @media (max-width: 768px) {
      .source-selector label {
        display: none;
      }
      .title-text {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div id="app-container">
    <header>
      <div class="title-group">
        <span class="title-badge">🏈</span>
        <h1 class="title-text">Retro Bowl</h1>
      </div>

      <!-- Server / Mirror Switcher -->
      <div class="source-selector">
        <label for="server-select">Server:</label>
        <select id="server-select" onchange="manualChangeServer(this.value)">
          <option value="0">GitHub WebGL (Primary)</option>
          <option value="1">RetroBowl.me (Official)</option>
          <option value="2">Unblocked Today</option>
          <option value="3">Vercel Mirror</option>
          <option value="4">RetroBowl.io</option>
          <option value="5">Classroom 6x</option>
        </select>
      </div>

      <div class="controls-group">
        <button id="next-mirror-btn" class="btn btn-secondary" onclick="tryNextMirror()" title="Switch to next mirror if blocked">
          🔄 Next Server
        </button>
        <button id="fullscreen-btn" class="btn btn-secondary" onclick="toggleFullScreen()" title="Full Screen">
          ⛶ Fullscreen
        </button>
        <a 
          id="newtab-btn"
          href="https://webglmath.github.io/retro-bowl/" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="btn btn-primary"
          title="Open in a fresh tab"
        >
          ↗ Open in Tab
        </a>
      </div>
    </header>

    <main id="game-wrapper">
      <div id="fallback-alert">Mirror unreachable, trying backup server...</div>
      
      <iframe
        id="game-frame"
        src="https://webglmath.github.io/retro-bowl/"
        title="Retro Bowl"
        allowfullscreen="true"
        frameborder="0"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
      ></iframe>
      <div class="loading-hint">If a school filter blocks this server, click "🔄 Next Server" or select from the dropdown above</div>
    </main>
  </div>

  <script>
    // List of mirror servers
    const MIRRORS = [
      { name: "GitHub WebGL (Primary)", url: "https://webglmath.github.io/retro-bowl/" },
      { name: "RetroBowl.me (Official)", url: "https://retrobowl.me/" },
      { name: "Unblocked Today", url: "https://retro-bowl.unblocked.today/" },
      { name: "Vercel Mirror", url: "https://retro-bowl-six.vercel.app" },
      { name: "RetroBowl.io", url: "https://retrobowl.io/" },
      { name: "Classroom 6x", url: "https://classroom6x.com/games/retro-bowl/" }
    ];

    let currentMirrorIndex = 0;
    let fallbackTimeout = null;

    function loadMirror(index) {
      currentMirrorIndex = (index + MIRRORS.length) % MIRRORS.length;
      const mirror = MIRRORS[currentMirrorIndex];
      const iframe = document.getElementById("game-frame");
      const select = document.getElementById("server-select");
      const newTabBtn = document.getElementById("newtab-btn");

      if (select) select.value = currentMirrorIndex;
      if (newTabBtn) newTabBtn.href = mirror.url;

      // Update iframe source
      iframe.src = mirror.url;

      // Reset fallback monitor
      if (fallbackTimeout) clearTimeout(fallbackTimeout);
      
      // Auto-fallback check: if iframe fails to trigger load within 7 seconds or onError
      fallbackTimeout = setTimeout(() => {
        // Can be triggered if completely blocked or hung
      }, 7000);
    }

    function tryNextMirror(isAutoFallback = false) {
      if (isAutoFallback) {
        showFallbackAlert();
      }
      loadMirror(currentMirrorIndex + 1);
    }

    function manualChangeServer(value) {
      loadMirror(parseInt(value, 10));
    }

    function showFallbackAlert() {
      const alertElem = document.getElementById("fallback-alert");
      if (alertElem) {
        alertElem.style.display = "block";
        setTimeout(() => {
          alertElem.style.display = "none";
        }, 4000);
      }
    }

    const iframeElem = document.getElementById("game-frame");
    iframeElem.addEventListener("error", () => {
      tryNextMirror(true);
    });

    function toggleFullScreen() {
      const elem = document.getElementById("game-wrapper") || document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Initialize with primary mirror
    loadMirror(0);
  </script>
</body>
</html>
