<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funbooks.lol</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --black: #000000;
      --dark: #050505;
      --darker: #020202;
      --gray: #141414;
      --lighter-gray: #1a1a1a;
      --text: #f0f0f0;
      --text-dim: #666666;
      --accent-cyan: #0ff;
      --accent-pink: #f0f;
      --accent-green: #0f0;
      --accent-red: #f44;
      --glow: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Starfield Canvas */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* URL Overlay for Secret Mode */
    #url-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--dark);
      z-index: 9999;
      display: none;
    }
    #url-overlay.active {
      display: block;
    }
    #url-content {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10000;
    }
    #url-content h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 1rem;
    }
    #url-content p {
      color: var(--text-dim);
      font-size: 1rem;
    }
    #url-content button {
      margin-top: 2rem;
      padding: 0.8rem 2rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      background: var(--accent-cyan);
      color: var(--dark);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    nav a {
      color: var(--text-dim);
      font-size: 0.85rem;
      font-weight: 300;
      margin-left: 1rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--accent-cyan);
    }

    /* Main Content */
    #app {
      padding-top: 80px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* News Section */
    .news {
      background: var(--darker);
      border: 1px solid var(--lighter-gray);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .news h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 1rem;
    }

    .news-item {
      margin-bottom: 0.6rem;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .news-item strong {
      color: var(--text);
    }

    /* News "Release" item - first one */
    .news-release {
      background: linear-gradient(135deg, #1a1a2e 0%, #0f0f23 100%);
      border-left: 4px solid var(--accent-cyan);
    }

    /* Section Headers */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .section-header h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    /* Games Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.2rem;
    }

    .game-card {
      background: var(--darker);
      border: 1px solid var(--lighter-gray);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .game-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 15px 40px rgba(255, 255, 255, 0.1), 0 0 30px rgba(255, 255, 255, 0.05);
      border-color: var(--accent-cyan);
    }

    .game-thumb {
      width: 80px;
      height: 80px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--dark);
      font-weight: 900;
    }

    .game-title {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .game-description {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 0.8rem;
      line-height: 1.3;
    }

    .game-actions {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      transition: transform 0.2s, opacity 0.2s;
    }

    .like-btn {
      background: rgba(0, 255, 255, 0.2);
      color: var(--accent-cyan);
    }

    .like-btn.liked {
      background: var(--accent-cyan);
      color: var(--dark);
    }

    .dislike-btn {
      background: rgba(255, 68, 68, 0.2);
      color: var(--accent-red);
    }

    .dislike-btn.disliked {
      background: var(--accent-red);
      color: var(--dark);
    }

    .play-btn {
      width: 100%;
      padding: 0.6rem 1rem;
      font-size: 0.8rem;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      color: var(--dark);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .play-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 255, 255, 0.3);
    }

    /* Iframe */
    #game-container {
      margin-top: 2rem;
      display: none;
    }

    #game-iframe {
      width: 100%;
      height: 550px;
      border: 1px solid var(--lighter-gray);
      border-radius: 12px;
    }

    /* Dark Mode Toggle */
    #dark-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--gray);
      color: var(--text);
      border: 1px solid var(--lighter-gray);
      padding: 0.5rem 0.8rem;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      z-index: 200;
      transition: all 0.3s ease;
    }

    #dark-toggle:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Secret Mode Toggle */
    #secret-toggle {
      position: fixed;
      top: 1rem;
      left: 1rem;
      background: var(--gray);
      color: var(--text-dim);
      border: 1px solid var(--lighter-gray);
      padding: 0.5rem 0.8rem;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      z-index: 200;
      transition: all 0.3s ease;
    }

    #secret-toggle:hover {
      border-color: var(--accent-pink);
      color: var(--accent-pink);
    }

    /* Live Users Counter */
    #live-users {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--darker);
      border: 1px solid var(--lighter-gray);
      padding: 0.5rem 1rem;
      font-size: 0.7rem;
      font-family: 'Orbitron', sans-serif;
      color: var(--text-dim);
      border-radius: 20px;
      z-index: 200;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0s !important;
        transition-duration: 0s !important;
      }
    }
  </style>
</head>
<body>
  <!-- Starfield Canvas -->
  <canvas id="starfield"></canvas>

  <!-- URL Overlay for Secret Mode -->
  <div id="url-overlay">
    <div id="url-content">
      <h2>Secret Mode Active</h2>
      <p>Current URL: funbooks.lol/<span id="url-suffix"></span></p>
      <button id="close-url">Close</button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <h1>funbooks.lol</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#games">Games</a>
      <a href="#news">News</a>
    </nav>
  </header>

  <!-- Live Users Counter -->
  <div id="live-users">Live Users: <span id="user-count">0</span></div>

  <!-- Main App Content -->
  <div id="app" class="container">
    <!-- News Section -->
    <section id="news">
      <div class="news news-release">
        <h2>Release</h2>
        <div class="news-item"><strong>we released tons of games and this was released on monday aug 16</strong></div>
        <div class="news-item">discord server coming soon</div>
      </div>
    </section>

    <!-- Trending Section -->
    <section id="trending">
      <div class="section-header">
        <h2>Trending</h2>
      </div>
      <div class="games-grid" id="trendingGrid"></div>
    </section>

    <!-- Favorites Section -->
    <section id="favorites">
      <div class="section-header">
        <h2>Favorites</h2>
      </div>
      <div class="games-grid" id="favoritesGrid"></div>
    </section>

    <!-- All Games Section -->
    <section id="all-games">
      <div class="section-header">
        <h2>All Games</h2>
      </div>
      <div class="games-grid" id="allGamesGrid"></div>
    </section>

    <!-- Iframe to Load Games -->
    <section id="game-container">
      <h2>Playing...</h2>
      <iframe id="game-iframe" src="" allow="autoplay; encrypted-media;"></iframe>
    </section>
  </div>

  <script>
    // ==== Configuration ====
    const CORRECT_CODE = "schoolbook1";

    // ==== URL Options for Secret Mode ====
    const urlOptions = ['math', 'english', 'history'];

    // ==== Game Data with Descriptions ====
    const games = [
      {
        title: "Shell Shockers",
        emoji: "🥚",
        description: "Shoot eggs in this fun multiplayer shooter game.",
        url: "https://example.com/shellshockers"
      },
      {
        title: "Slope",
        emoji: "⛰️",
        description: "Survive the endless slope in this fast-paced runner.",
        url: "https://example.com/slope"
      },
      {
        title: "Run 3",
        emoji: "🚀",
        description: "Run through space in this cool endless runner adventure.",
        url: "https://example.com/run3"
      },
      {
        title: "Moto X3M",
        emoji: "🏍️",
        description: "Race through crazy tracks on your motorbike!",
        url: "https://example.com/moto-x3m"
      },
      {
        title: "Fireboy and Watergirl",
        emoji: "🔥💧",
        description: "Solve puzzles with Fireboy and Watergirl in this classic duo game.",
        url: "https://example.com/fireboy"
      },
      {
        title: "Papa's Games",
        emoji: "👩‍🍳",
        description: "Run your own restaurant in this fun cooking simulation.",
        url: "https://example.com/papas"
      },
      {
        title: "1v1.LOL",
        emoji: "👊🏽",
        description: "Battle it out in this Fortnite-style building shooter.",
        url: "https://example.com/1v1lol"
      },
      {
        title: "Cookie Clicker",
        emoji: "🍪",
        description: "Click to bake cookies and build your cookie empire!",
        url: "https://example.com/cookie-clicker"
      }
    ];

    // ==== State ====
    let secretMode = false;
    let liveUserCount = parseInt(localStorage.getItem('funbooksLiveUsers') || '0');
    const gameLikes = JSON.parse(localStorage.getItem('funbooksGameLikes') || '{}');
    const gameDislikes = JSON.parse(localStorage.getItem('funbooksGameDislikes') || '{}');

    // ==== DOM Elements ====
    const starfield = document.getElementById('starfield');
    const ctx = starfield.getContext('2d');
    const urlOverlay = document.getElementById('url-overlay');
    const urlContent = document.getElementById('url-content');
    const closeUrlBtn = document.getElementById('close-url');
    const urlSuffixSpan = document.getElementById('url-suffix');
    const liveUsersSpan = document.getElementById('user-count');
    const trendingGrid = document.getElementById('trendingGrid');
    const favoritesGrid = document.getElementById('favoritesGrid');
    const allGamesGrid = document.getElementById('allGamesGrid');
    const iframe = document.getElementById('game-iframe');
    const gameContainer = document.getElementById('game-container');
    const darkToggle = document.getElementById('dark-toggle');
    const secretToggle = document.getElementById('secret-toggle');

    // ==== Starfield Canvas Setup ====
    let stars = [];

    function initCanvas() {
      starfield.width = window.innerWidth;
      starfield.height = window.innerHeight;
      window.addEventListener('resize', () => {
        starfield.width = window.innerWidth;
        starfield.height = window.innerHeight;
      });
    }

    function createStars() {
      stars = [];
      for (let i = 0; i < 150; i++) {
        stars.push({
          x: Math.random() * starfield.width,
          y: Math.random() * starfield.height,
          size: Math.random() * 2 + 0.5,
          speed: Math.random() * 0.5 + 0.1,
          opacity: Math.random() * 0.5 + 0.3
        });
      }
    }

    function animateStars() {
      ctx.clearRect(0, 0, starfield.width, starfield.height);
      
      stars.forEach(star => {
        ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
        
        star.y += star.speed;
        if (star.y > starfield.height) {
          star.y = 0;
          star.x = Math.random() * starfield.width;
        }
      });
      
      requestAnimationFrame(animateStars);
    }

    // ==== Secret Mode URL ====
    secretToggle.addEventListener('click', () => {
      secretMode = !secretMode;
      document.body.classList.toggle('secret-mode', secretMode);
      
      if (secretMode) {
        const randomSuffix = urlOptions[Math.floor(Math.random() * urlOptions.length)];
        urlSuffixSpan.textContent = randomSuffix;
        const newUrl = window.location.origin + '/funbooks.lol/' + randomSuffix;
        window.history.pushState({ path: newUrl }, '', newUrl);
        urlOverlay.classList.add('active');
      } else {
        urlOverlay.classList.remove('active');
        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.pushState({ path: cleanUrl }, '', cleanUrl);
      }
    });

    closeUrlBtn.addEventListener('click', () => {
      secretMode = false;
      document.body.classList.remove('secret-mode');
      urlOverlay.classList.remove('active');
      const cleanUrl = window.location.origin + window.location.pathname;
      window.history.pushState({ path: cleanUrl }, '', cleanUrl);
    });

    // ==== Live User Counter ====
    liveUserCount++;
    localStorage.setItem('funbooksLiveUsers', liveUserCount.toString());
    liveUsersSpan.textContent = liveUserCount;

    window.addEventListener('beforeunload', () => {
      liveUserCount--;
      localStorage.setItem('funbooksLiveUsers', liveUserCount.toString());
      liveUsersSpan.textContent = Math.max(0, liveUserCount);
    });

    // ==== Render Game Card ====
    function renderGameCard(game, containerId) {
      const container = document.getElementById(containerId);
      const card = document.createElement('div');
      card.className = 'game-card';
      
      const likes = gameLikes[game.title] || 0;
      const dislikes = gameDislikes[game.title] || 0;
      
      card.innerHTML = `
        <div class="game-thumb">${game.emoji}</div>
        <h3 class="game-title">${game.title}</h3>
        <div class="game-description">${game.description}</div>
        <div class="game-actions">
          <button class="action-btn like-btn" data-game="${game.title}"><i class="fas fa-thumbs-up"></i> ${likes}</button>
          <button class="action-btn dislike-btn" data-game="${game.title}"><i class="fas fa-thumbs-down"></i> ${dislikes}</button>
        </div>
        <button class="play-btn" data-game="${game.title}">Play</button>
      `;
      
      // Like button
      card.querySelector('.like-btn').addEventListener('click', (e) => {
        const gameTitle = e.target.dataset.game;
        gameLikes[gameTitle] = (gameLikes[gameTitle] || 0) + 1;
        localStorage.setItem('funbooksGameLikes', JSON.stringify(gameLikes));
        renderGameCard(games.find(g => g.title === gameTitle), containerId);
      });

      // Dislike button
      card.querySelector('.dislike-btn').addEventListener('click', (e) => {
        const gameTitle = e.target.dataset.game;
        gameDislikes[gameTitle] = (gameDislikes[gameTitle] || 0) + 1;
        localStorage.setItem('funbooksGameDislikes', JSON.stringify(gameDislikes));
        renderGameCard(games.find(g => g.title === gameTitle), containerId);
      });

      // Play button
      card.querySelector('.play-btn').addEventListener('click', () => {
        // Set random secret URL
        const randomSuffix = urlOptions[Math.floor(Math.random() * urlOptions.length)];
        const newUrl = window.location.origin + '/funbooks.lol/' + randomSuffix;
        window.history.pushState({ path: newUrl }, '', newUrl);
        
        // Show URL overlay if secret mode is enabled
        if (secretMode) {
          urlSuffixSpan.textContent = randomSuffix;
          urlOverlay.classList.add('active');
        }
        
        iframe.src = game.url;
        gameContainer.style.display = 'block';
      });

      container.appendChild(card);
    }

    // ==== Render All Sections ====
    function renderAllSections() {
      // Trending - first 4 games
      games.slice(0, 4).forEach(game => {
        renderGameCard(game, 'trendingGrid');
      });

      // Favorites - games 3-6
      games.slice(2, 6).forEach(game => {
        renderGameCard(game, 'favoritesGrid');
      });

      // All Games - all games
      games.forEach(game => {
        renderGameCard(game, 'allGamesGrid');
      });
    }

    // ==== Dark Mode Toggle ====
    darkToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });

    // ==== Initialization ====
    initCanvas();
    createStars();
    animateStars();
    renderAllSections();
  </script>
</body>
</html>
