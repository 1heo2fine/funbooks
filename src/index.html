<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏈 Retro Bowl - Unblocked</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 10%, #1e293b 0%, #0f172a 100%);
    }

    /* Top Navigation Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      height: 56px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 20;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-badge {
      font-size: 1.5rem;
      line-height: 1;
    }

    .title-text {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease-in-out;
      border: 1px solid transparent;
      outline: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: #e2e8f0;
      border-color: rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .btn-primary:hover {
      background: #0369a1;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Game Viewport */
    main {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 56px);
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    /* Fallback / Loading Banner */
    .loading-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <header>
      <div class="title-group">
        <span class="title-badge">🏈</span>
        <h1 class="title-text">Retro Bowl</h1>
      </div>

      <div class="controls-group">
        <button id="fullscreen-btn" class="btn btn-secondary" onclick="toggleFullScreen()" title="Full Screen">
          ⛶ Fullscreen
        </button>
        <a 
          href="https://webglmath.github.io/retro-bowl/" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="btn btn-primary"
          title="Open in a fresh tab if game doesn't load"
        >
          ↗ Open in New Tab
        </a>
      </div>
    </header>

    <main id="game-wrapper">
      <iframe
        id="game-frame"
        src="https://webglmath.github.io/retro-bowl/"
        title="Retro Bowl"
        allowfullscreen="true"
        frameborder="0"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
      ></iframe>
      <div class="loading-hint">Click inside to control the game • Works with touch, mouse & keyboard</div>
    </main>
  </div>

  <script>
    function toggleFullScreen() {
      const elem = document.getElementById("game-wrapper") || document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>
</body>
</html>
