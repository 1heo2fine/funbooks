<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔗 Mirror Status Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 32px;
      max-width: 600px;
    }

    .page-title {
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .page-subtitle {
      color: #94a3b8;
      font-weight: 600;
      font-size: 1rem;
      margin-top: 8px;
    }

    .links-list {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 20px;
      transition: all 0.2s ease;
      gap: 16px;
    }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .check-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .check-icon.loading {
      background: rgba(234, 179, 8, 0.15);
      color: #eab308;
      font-size: 1rem;
    }

    .check-icon.error {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .check-icon.spinner {
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
    }

    .check-icon.spinner::after {
      content: '';
      width: 14px;
      height: 14px;
      border: 2px solid transparent;
      border-top-color: #94a3b8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .link-info {
      flex: 1;
      min-width: 0;
    }

    .link-url {
      color: #f1f5f9;
      font-weight: 700;
      font-size: 1.05rem;
      text-decoration: none;
      word-break: break-all;
      display: block;
    }

    .link-url:hover {
      color: #38bdf8;
    }

    .link-status-text {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 2px;
      font-weight: 600;
    }

    .link-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .vote-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 700;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .vote-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .vote-btn.up:hover, .vote-btn.up.active {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border-color: rgba(34, 197, 94, 0.4);
    }

    .vote-btn.down:hover, .vote-btn.down.active {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .vote-count {
      min-width: 18px;
      text-align: center;
    }

    .actions-bar {
      margin-top: 32px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
    }

    .btn-primary {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .btn-primary:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.07);
      color: #e2e8f0;
      border-color: rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }

    @media (max-width: 600px) {
      .page-title { font-size: 1.8rem; }
      .link-card { flex-direction: column; align-items: stretch; }
      .link-right { justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1 class="page-title">🔗 Mirror Status Checker</h1>
    <p class="page-subtitle">Click a link to open it. Vote on whether it works.</p>
  </div>

  <div class="links-list" id="links-list">
    <!-- Link cards will be dynamically inserted here -->
  </div>

  <div class="actions-bar">
    <button class="btn btn-secondary" onclick="recheckAll()">🔄 Re-check All</button>
  </div>

  <script>
    // Edit this list to add/remove mirrors
    const MIRRORS = [
      { name: "Unblocked Test", url: "https://unblockedtest.com" },
      { name: "Retro Bowl Official", url: "https://retrobowl.me" },
      { name: "Retro Bowl Unblocked", url: "https://retro-bowl.unblocked.today" },
      { name: "Vercel Mirror", url: "https://retro-bowl-six.vercel.app" },
      { name: "RetroBowl.io", url: "https://retrobowl.io" },
      { name: "Classroom 6x", url: "https://classroom6x.com/games/retro-bowl" }
    ];

    // Storage keys
    const VOTES_KEY = "mirror_votes";
    const STATUS_KEY = "mirror_status";

    function loadVotes() {
      try {
        return JSON.parse(localStorage.getItem(VOTES_KEY) || "{}");
      } catch (e) {
        return {};
      }
    }

    function saveVotes(votes) {
      localStorage.setItem(VOTES_KEY, JSON.stringify(votes));
    }

    function loadStoredStatus() {
      try {
        return JSON.parse(localStorage.getItem(STATUS_KEY) || "{}");
      } catch (e) {
        return {};
      }
    }

    function saveStoredStatus(status) {
      localStorage.setItem(STATUS_KEY, JSON.stringify(status));
    }

    function getVoteData(mirrorId) {
      const votes = loadVotes();
      return votes[mirrorId] || { up: 0, down: 0, userVote: null };
    }

    function setVote(mirrorId, direction) {
      const votes = loadVotes();
      const current = votes[mirrorId] || { up: 0, down: 0, userVote: null };
      const newVote = { up: current.up, down: current.down, userVote: current.userVote };

      // If user already voted this way, undo it
      if (newVote.userVote === direction) {
        if (direction === "up") newVote.up = Math.max(0, newVote.up - 1);
        else newVote.down = Math.max(0, newVote.down - 1);
        newVote.userVote = null;
      } else {
        // Remove old vote
        if (newVote.userVote === "up") newVote.up = Math.max(0, newVote.up - 1);
        else if (newVote.userVote === "down") newVote.down = Math.max(0, newVote.down - 1);
        // Add new vote
        if (direction === "up") newVote.up += 1;
        else newVote.down += 1;
        newVote.userVote = direction;
      }

      votes[mirrorId] = newVote;
      saveVotes(votes);
      renderAll();
    }

    function renderLinkCard(mirror, index) {
      const stored = loadStoredStatus();
      const status = stored[mirror.url] || { state: "checking", text: "Checking..." };
      const voteData = getVoteData(mirror.url);
      const isUp = voteData.userVote === "up";
      const isDown = voteData.userVote === "down";

      const checkClass = status.state === "ok" ? "" : 
                        status.state === "error" ? "error" : 
                        status.state === "checking" ? "spinner" : "loading";
      const checkIcon = status.state === "ok" ? "✓" : 
                       status.state === "error" ? "✕" : "";

      return `
        <div class="link-card" data-url="${mirror.url}">
          <div class="link-left">
            <div class="check-icon ${checkClass}">${checkIcon}</div>
            <div class="link-info">
              <a class="link-url" href="${mirror.url}" target="_blank" rel="noopener noreferrer">${mirror.name}</a>
              <div class="link-status-text">${status.text}</div>
            </div>
          </div>
          <div class="link-right">
            <button class="vote-btn up ${isUp ? "active" : ""}" onclick="setVote('${mirror.url}', 'up')" title="Mark as working">
              👍 <span class="vote-count">${voteData.up}</span>
            </button>
            <button class="vote-btn down ${isDown ? "active" : ""}" onclick="setVote('${mirror.url}', 'down')" title="Mark as broken">
              👎 <span class="vote-count">${voteData.down}</span>
            </button>
          </div>
        </div>
      `;
    }

    function renderAll() {
      const list = document.getElementById("links-list");
      list.innerHTML = MIRRORS.map(renderLinkCard).join("");
    }

    // Check status of a URL by trying to fetch it
    async function checkStatus(url) {
      return new Promise((resolve) => {
        // Use an image trick to avoid CORS issues
        const img = new Image();
        let resolved = false;

        const finish = (state, text) => {
          if (resolved) return;
          resolved = true;
          resolve({ state, text });
        };

        const timeout = setTimeout(() => {
          finish("error", "Timeout / Possibly blocked");
        }, 5000);

        img.onload = () => {
          clearTimeout(timeout);
          finish("ok", "Reachable ✓");
        };
        img.onerror = () => {
          clearTimeout(timeout);
          // Some sites block image loading, try alternative
          finish("error", "Blocked or unreachable");
        };

        // Use a dummy image path on the target domain
        img.src = url + "/favicon.ico?cb=" + Date.now();
      });
    }

    async function recheckAll() {
      const stored = loadStoredStatus();
      // Mark all as checking
      MIRRORS.forEach(m => {
        stored[m.url] = { state: "checking", text: "Checking..." };
      });
      saveStoredStatus(stored);
      renderAll();

      // Check each one
      for (const mirror of MIRRORS) {
        const result = await checkStatus(mirror.url);
        const s = loadStoredStatus();
        s[mirror.url] = result;
        saveStoredStatus(s);
        renderAll();
      }
    }

    // Initial render
    renderAll();

    // Auto check on load
    recheckAll();
  </script>
</body>
</html>
