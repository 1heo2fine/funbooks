  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 80px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 600px;
    }

    .page-title {
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .page-subtitle {
      color: #94a3b8;
      font-weight: 600;
      font-size: 1rem;
      margin-top: 8px;
    }

    .search-bar {
      width: 100%;
      max-width: 700px;
      margin-bottom: 20px;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #f8fafc;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .search-bar input::placeholder {
      color: #64748b;
    }

    .search-bar input:focus {
      background: rgba(255, 255, 255, 0.09);
      border-color: #38bdf8;
    }

    .search-bar .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 1.1rem;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-chip {
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .filter-chip:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .filter-chip.active {
      background: #0284c7;
      border-color: #0284c7;
      color: #fff;
    }

    .links-list {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 18px;
      transition: all 0.2s ease;
      gap: 16px;
      cursor: pointer;
    }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .status-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 1rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    .status-icon.unblocked {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }

    .status-icon.blocked {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .status-icon.partial {
      background: rgba(234, 179, 8, 0.15);
      color: #eab308;
    }

    .status-icon.new {
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
    }

    .link-info {
      flex: 1;
      min-width: 0;
    }

    .link-url {
      color: #f1f5f9;
      font-weight: 700;
      font-size: 1rem;
      word-break: break-all;
      display: block;
    }

    .link-status-text {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 2px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .link-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .vote-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 800;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .vote-btn:hover {

    }

    .vote-btn.up:hover, .vote-btn.up.active {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border-color: rgba(34, 197, 94, 0.4);

    .vote-btn.down:hover, .vote-btn.down.active {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .vote-count {
      min-width: 16px;
      text-align: center;
      font-size: 0.8rem;
    }

    .empty-state {

      color: #64748b;
      padding: 40px 20px;

      .link-url { font-size: 0.9rem; }

    const VOTES_KEY = "mirror_votes";
    let currentFilter = "all";
    let searchTerm = "";

    function loadVotes() {
      try {
        return JSON.parse(localStorage.getItem(VOTES_KEY) || "{}");
      } catch (e) {
        return {};
      }
    }

    function saveVotes(votes) {
      localStorage.setItem(VOTES_KEY, JSON.stringify(votes));
    }

    function getVoteData(url) {
      const votes = loadVotes();
      return votes[url] || { up: 0, down: 0, userVote: null };
    }

    function setVote(url, direction, event) {
      event.stopPropagation();
      const votes = loadVotes();
      const current = votes[url] || { up: 0, down: 0, userVote: null };
      const newVote = { up: current.up, down: current.down, userVote: current.userVote };

      if (newVote.userVote === direction) {
        if (direction === "up") newVote.up = Math.max(0, newVote.up - 1);
        else newVote.down = Math.max(0, newVote.down - 1);
        newVote.userVote = null;
      } else {
        if (newVote.userVote === "up") newVote.up = Math.max(0, newVote.up - 1);
        else if (newVote.userVote === "down") newVote.down = Math.max(0, newVote.down - 1);
        if (direction === "up") newVote.up += 1;
        else newVote.down += 1;
        newVote.userVote = direction;
      }

      votes[url] = newVote;
      saveVotes(votes);
      renderAll();
    }

    // Compute status purely from votes
    function computeStatus(url) {
      const v = getVoteData(url);
      const total = v.up + v.down;
      if (total === 0) return { kind: "new", label: "Unverified" };
      if (v.up > v.down) return { kind: "unblocked", label: "Unblocked" };
      if (v.down > v.up) return { kind: "blocked", label: "Blocked" };
      return { kind: "partial", label: "Unblocked for some schools" };
    }

    function statusToIcon(kind) {
      if (kind === "unblocked") return "✓";
      if (kind === "blocked") return "✕";
      if (kind === "partial") return "!";
      return "?";
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function renderLinkCard(mirror) {
      const status = computeStatus(mirror.url);
      const v = getVoteData(mirror.url);
      const isUp = v.userVote === "up";
      const isDown = v.userVote === "down";

      return `
        <div class="link-card" onclick="window.open('${escapeHtml(mirror.url)}', '_blank')">
          <div class="link-left">
            <div class="status-icon ${status.kind}">${statusToIcon(status.kind)}</div>
            <div class="link-info">
              <span class="link-url">${escapeHtml(mirror.name)}</span>
              <div class="link-status-text">${status.label}</div>
            </div>
          </div>
          <div class="link-right">
            <button class="vote-btn up ${isUp ? "active" : ""}" onclick="setVote('${escapeHtml(mirror.url)}', 'up', event)" title="Works at my school">👍 <span class="vote-count">${v.up}</span></button>
            <button class="vote-btn down ${isDown ? "active" : ""}" onclick="setVote('${escapeHtml(mirror.url)}', 'down', event)" title="Blocked at my school">👎 <span class="vote-count">${v.down}</span></button>
          </div>
        </div>
      `;
    }

    function renderAll() {
      const list = document.getElementById("links-list");
      const term = searchTerm.toLowerCase();

      let filtered = MIRRORS.filter(m => {
        const matchesSearch = !term || m.name.toLowerCase().includes(term) || m.url.toLowerCase().includes(term);
        if (!matchesSearch) return false;
        if (currentFilter === "all") return true;
        return computeStatus(m.url).kind === currentFilter;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">No links match your search.</div>`;
        return;
      }

      list.innerHTML = filtered.map(renderLinkCard).join("");
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll(".filter-chip").forEach(chip => {
        chip.classList.toggle("active", chip.dataset.filter === filter);
      });
      renderAll();
    }

    document.getElementById("search-input").addEventListener("input", e => {
      searchTerm = e.target.value;
      renderAll();
    });

    renderAll();
