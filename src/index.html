<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>funbooks.lol — Unblocked Games Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #030305;
      --surface-glass: rgba(255, 255, 255, 0.035);
      --surface-glass-hover: rgba(255, 255, 255, 0.07);
      --surface-glass-active: rgba(255, 255, 255, 0.12);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glass-hover: rgba(255, 255, 255, 0.22);
      --border-specular: rgba(255, 255, 255, 0.16);
      
      --text-main: #f4f4f7;
      --text-muted: #8b8d99;
      --text-dim: #545663;
      
      --accent-white: #ffffff;
      --accent-emerald: #22c55e;
      --accent-rose: #f43f5e;
      
      --radius-full: 9999px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 100px;
      position: relative;
    }

    /* Ambient Orb Lighting Background */
    .bg-sphere {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 820px;
      height: 520px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 45%, transparent 75%);
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }

    .bg-ring {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
      max-width: 1200px;
      height: 700px;
      border: 1px solid rgba(255, 255, 255, 0.025);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 30%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .page-title {
      font-size: clamp(2.4rem, 6.5vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.05;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, #d6d7e0 55%, #76788a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .page-subtitle {
      color: var(--text-muted);
      font-size: clamp(0.9rem, 1.8vw, 1.05rem);
      font-weight: 400;
      text-align: center;
      max-width: 540px;
      line-height: 1.55;
      letter-spacing: -0.01em;
      margin-bottom: 30px;
    }

    /* Liquid Glass Search Bar */
    .search-container {
      width: 100%;
      margin-bottom: 24px;
      position: relative;
    }

    .search-glass-shell {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      padding: 6px 10px 6px 20px;
      backdrop-filter: blur(36px) saturate(190%);
      -webkit-backdrop-filter: blur(36px) saturate(190%);
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.15),
        inset 0 -1px 2px rgba(0, 0, 0, 0.3),
        0 20px 45px rgba(0, 0, 0, 0.65);
      transition: all 0.3s var(--ease);
    }

    .search-glass-shell:hover {
      border-color: var(--border-glass-hover);
      background: rgba(255, 255, 255, 0.06);
    }

    .search-glass-shell:focus-within {
      background: rgba(255, 255, 255, 0.075);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 
        inset 0 1px 2px rgba(255, 255, 255, 0.25),
        0 0 0 3px rgba(255, 255, 255, 0.06),
        0 24px 50px rgba(0, 0, 0, 0.75);
    }

    .search-icon-svg {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-right: 12px;
      transition: color 0.2s var(--ease);
    }

    .search-glass-shell:focus-within .search-icon-svg {
      color: var(--accent-white);
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 500;
      font-family: inherit;
      padding: 10px 0;
    }

    .search-input::placeholder {
      color: var(--text-dim);
      font-weight: 400;
    }

    .search-clear-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      margin-right: 6px;
      transition: all 0.15s var(--ease);
    }

    .search-clear-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-main);
    }

    .search-badge-hint {
      font-size: 0.68rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 4px 8px;
      flex-shrink: 0;
      user-select: none;
    }

    .results-meta {
      width: 100%;
      margin-bottom: 12px;
      margin-top: -12px;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
    }

    /* Liquid Glass Filter Bar */
    .filter-scroll-wrap {
      width: 100%;
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-glass-pill {
      position: relative;
      background: var(--surface-glass);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-full);
      padding: 9px 18px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      cursor: pointer;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08), 0 4px 16px rgba(0, 0, 0, 0.25);
      transition: all 0.25s var(--ease);
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-glass-pill:hover {
      background: var(--surface-glass-hover);
      border-color: var(--border-glass-hover);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    .filter-glass-pill.active {
      background: #ffffff;
      border-color: #ffffff;
      color: #030305;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    /* Liquid Glass List Cards */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--surface-glass);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.09),
        0 10px 30px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: all 0.25s var(--ease);
      overflow: hidden;
    }

    .link-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.18) 50%, transparent 100%);
      opacity: 0.6;
    }

    .link-card:hover {
      background: var(--surface-glass-hover);
      border-color: var(--border-glass-hover);
      transform: translateY(-2px);
      box-shadow: 
        inset 0 1px 1.5px rgba(255, 255, 255, 0.18),
        0 16px 40px rgba(0, 0, 0, 0.6);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .link-dot-status {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
      transition: all 0.2s var(--ease);
    }

    .link-card:hover .link-dot-status {
      background: var(--accent-white);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .link-info {
      flex: 1;
      min-width: 0;
    }

    .link-url {
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: -0.015em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.2s var(--ease);
    }

    .link-card:hover .link-url {
      color: var(--accent-white);
    }

    .link-sub-url {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Liquid Glass Vote & Launch Buttons */
    .glass-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      padding: 7px 11px;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08);
      transition: all 0.2s var(--ease);
      user-select: none;
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--border-glass-hover);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    .glass-btn:active {
      transform: scale(0.96);
    }

    .glass-btn.up:hover,
    .glass-btn.up.active {
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.35);
      color: var(--accent-emerald);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.2), inset 0 1px 1px rgba(34, 197, 94, 0.3);
    }

    .glass-btn.down:hover,
    .glass-btn.down.active {
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.35);
      color: var(--accent-rose);
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.2), inset 0 1px 1px rgba(244, 63, 94, 0.3);
    }

    .glass-btn-cta {
      background: #ffffff;
      border: 1px solid #ffffff;
      color: #030305;
      padding: 7px 14px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.78rem;
      letter-spacing: -0.01em;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.25);
    }

    .glass-btn-cta:hover {
      background: #e8e8ee;
      border-color: #e8e8ee;
      color: #000000;
    }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 60px 20px;
      font-weight: 500;
      font-size: 0.95rem;
      background: var(--surface-glass);
      border: 1px dashed var(--border-glass);
      border-radius: var(--radius-md);
      width: 100%;
    }

    /* Proxy Browser FAB */
    .browser-fab {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: -0.01em;
      cursor: pointer;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08), 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s var(--ease);
      user-select: none;
    }
    .browser-fab:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-glass-hover);
      color: var(--text-main);
      transform: translateY(-1px);
    }
    .instagram-fab {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: -0.01em;
      cursor: pointer;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.08), 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s var(--ease);
      user-select: none;
      text-decoration: none;
    }
    .instagram-fab:hover {
      background: linear-gradient(135deg, rgba(253,87,88,0.18) 0%, rgba(131,58,180,0.18) 50%, rgba(253,196,104,0.12) 100%);
      border-color: rgba(253,87,88,0.45);
      color: #f9a0a0;
      transform: translateY(-1px);
    }

    /* Proxy Browser Overlay */
    .proxy-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      background: rgba(3, 3, 5, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .proxy-chrome {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border-glass);
    }

    .proxy-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
    }

    .proxy-nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s var(--ease);
      flex-shrink: 0;
    }
    .proxy-nav-btn:hover:not(:disabled) {
      background: var(--surface-glass-hover);
      border-color: var(--border-glass);
      color: var(--text-main);
    }
    .proxy-nav-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .proxy-url-input {
      flex: 1;
      height: 34px;
      padding: 0 14px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      font-size: 0.82rem;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: all 0.2s var(--ease);
    }
    .proxy-url-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .proxy-url-input::placeholder {
      color: var(--text-dim);
      font-family: inherit;
    }

    .proxy-go-btn {
      height: 34px;
      padding: 0 16px;
      border-radius: var(--radius-full);
      background: #ffffff;
      border: 1px solid #ffffff;
      color: #030305;
      font-size: 0.78rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s var(--ease);
    }
    .proxy-go-btn:hover {
      background: #e0e0e8;
      border-color: #e0e0e8;
    }

    .proxy-close-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s var(--ease);
    }
    .proxy-close-btn:hover {
      background: rgba(244, 63, 94, 0.12);
      border-color: rgba(244, 63, 94, 0.3);
      color: var(--accent-rose);
    }

    .proxy-status-bar {
      padding: 4px 14px 6px;
      font-size: 0.68rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
      border-top: 1px solid var(--border-glass);
    }

    .proxy-frame-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .proxy-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fff;
    }

    .proxy-blocked {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--bg);
      padding: 40px 20px;
      text-align: center;
    }
    .proxy-blocked-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .proxy-blocked-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      max-width: 360px;
      line-height: 1.5;
    }
    .proxy-open-tab-btn {
      margin-top: 8px;
      padding: 9px 20px;
      border-radius: var(--radius-full);
      background: #ffffff;
      border: 1px solid #ffffff;
      color: #030305;
      font-size: 0.82rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s var(--ease);
    }
    .proxy-open-tab-btn:hover { background: #e0e0e8; border-color: #e0e0e8; }

    /* Custom Minimal Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

    @media (max-width: 640px) {
      body { padding: 40px 16px 80px; }
      .link-card { padding: 12px 14px; }
      .link-url { font-size: 0.88rem; }
      .link-sub-url { display: none; }
      .filter-glass-pill { padding: 7px 14px; font-size: 0.7rem; }
      .glass-btn { padding: 6px 9px; font-size: 0.7rem; }
      .glass-btn-cta { display: none; }
    }
  </style>
</head>
<body>
  <!-- Ambient Orbs & Geometric Rings matching reference -->
  <div class="bg-sphere"></div>
  <div class="bg-ring"></div>
  <div class="bg-grid"></div>

  <div class="app-container">
    <!-- Title & Subtitle -->
    <h1 class="page-title">funbooks.lol</h1>
    <p class="page-subtitle">new sites every day · made by 1heo</p>

    <!-- Liquid Glass Search Bar -->
    <div class="search-container">
      <div class="search-glass-shell">
        <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search-input" class="search-input" type="text" placeholder="Search games, proxies, educational sites..." autocomplete="off" />
        <button id="search-clear" class="search-clear-btn" style="display:none" aria-label="Clear search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <span class="search-badge-hint">⌘K</span>
      </div>
    </div>

    <!-- Liquid Glass Filter Bar -->
    <div class="filter-scroll-wrap" id="filter-bar">
      <button class="filter-glass-pill active" data-filter="all">All sites</button>
      <button class="filter-glass-pill" data-filter="hot">Hot</button>
      <button class="filter-glass-pill" data-filter="new">New</button>
      <button class="filter-glass-pill" data-filter="recommended">Recommended</button>
    </div>

    <!-- Results count -->
    <div class="results-meta">

  <!-- Proxy Browser Overlay -->
  <div id="proxy-browser-overlay" class="proxy-overlay" style="display:none">
    <div class="proxy-chrome">
      <div class="proxy-bar">
        <button class="proxy-nav-btn" id="browser-back" title="Back" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="proxy-nav-btn" id="browser-forward" title="Forward" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <button class="proxy-nav-btn" id="browser-refresh" title="Refresh">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
        <input id="browser-url" class="proxy-url-input" type="text" placeholder="Search or enter a URL..." autocomplete="off" spellcheck="false" />

        <button class="proxy-close-btn" id="browser-close" title="Close">

      <div id="browser-status-bar" class="proxy-status-bar" style="display:none">
        <span id="browser-status-text"></span>
      </div>
    </div>
    <div class="proxy-frame-wrap">
      <iframe id="browser-frame" class="proxy-frame" src="about:blank" allowfullscreen></iframe>
      <div id="browser-blocked-msg" class="proxy-blocked" style="display:none">
        <p class="proxy-blocked-title">This site can't be embedded</p>
        <p class="proxy-blocked-sub">The page blocked display in iframes. Try opening it directly instead.</p>
        <button id="browser-open-tab" class="proxy-open-tab-btn">Open in new tab</button>
      </div>
    </div>
  </div>
